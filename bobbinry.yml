# Bobbinry entity mapping — replaced wiki/mapping.yml when the MediaWiki was
# dropped (2026-07-14). Canon Git Markdown is the source of truth; Bobbinry
# entities are the curated, reader-facing view.
#
# Pushes are DELIBERATE and per-entity — there is no auto-publish. Entities
# are structured data (fields, tags, era variants), not rendered pages, and
# published entityData is reader-visible: content must stay behind the
# published-chapter spoiler line. Use tools/check_bobbinry_drift.py to see
# what has drifted; apply updates by hand or via the bobbinry CLI.

